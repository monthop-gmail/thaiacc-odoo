# gitaggregate configuration
# Usage: pip install git-aggregator && gitaggregate -c repos.yml
#
# 20.0 STATUS (as of 2026-09-26, Odoo 20 release week): only OCA/partner-contact
# has a 20.0 branch yet. Entries below target 20.0 and will fail loudly (branch
# not found) until the OCA 20.0 branches exist — the devcontainer entrypoint
# turns that into a clear error instead of starting Odoo on a broken tree.
# Uncomment entries per repo as their 20.0 branches land, or re-pin to 19.0
# if you need the 19.0 stack (use the 19.0 branch of this repo for that).
# This pulls OCA modules from our forks (with pending migration PRs)
# Once PRs are merged upstream, switch remotes from monthop → oca

# Needed for date_range (l10n_th_account_tax_report depends on it).
# The tier_validation family moved out of this repo for 19.0 — see ./tier-validation.
./server-ux:
  remotes:
    oca: https://github.com/OCA/server-ux.git
  merges:
    - oca 20.0
  target: oca 20.0

# New repo in 19.0: the whole tier_validation family was split out of server-ux.
# Provides base_tier_validation, base_tier_validation_formula,
# purchase_request_tier_validation.
./tier-validation:
  remotes:
    oca: https://github.com/OCA/tier-validation.git
  merges:
    - oca 20.0
  target: oca 20.0

./l10n-thailand:
  remotes:
    oca: https://github.com/OCA/l10n-thailand.git
    monthop: https://github.com/monthop-gmail/l10n-thailand.git
  # Drop a branch once its PR is merged upstream: it becomes an ancestor of
  # oca 19.0, so merging it is a no-op that only slows the aggregate down and
  # makes this list look like more is pending than really is.
  # Merged so far: l10n_th_base_utils (#577), l10n_th_account_tax (#578).
  merges:
    - oca 20.0
    - monthop 20.0-mig-l10n_th_account_tax_report
    - monthop 20.0-mig-l10n_th_account_wht_cert_form
    - monthop 20.0-mig-l10n_th_mis_report
    - monthop 20.0-mig-l10n_th_partner
    - monthop 20.0-mig-l10n_th_tier_department
    - monthop 20.0-mig-l10n_th_tier_department_demo
  target: monthop merge-20.0
  fetch_all: true
  shell_command_after:
    # resolve .codecov.yml conflicts from multiple branches
    - rm -f .codecov.yml && git add -A && git diff --cached --quiet || git commit --no-verify -m "[AGG] remove .codecov.yml (not needed in aggregate)"

# partner_company_type was merged upstream via OCA/partner-contact#2161,
# so the fork branch is no longer needed.
./partner-contact:
  remotes:
    oca: https://github.com/OCA/partner-contact.git
  merges:
    - oca 20.0
  target: oca 20.0

# mis_builder was released on OCA/mis-builder 19.0 (19.0.1.2.0), so the
# versada migration branch is no longer needed.
./mis-builder:
  remotes:
    oca: https://github.com/OCA/mis-builder.git
  merges:
    - oca 20.0
  target: oca 20.0

./reporting-engine:
  remotes:
    oca: https://github.com/OCA/reporting-engine.git
  merges:
    - oca 20.0
  target: oca 20.0
