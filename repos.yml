# gitaggregate configuration
# Usage: pip install git-aggregator && gitaggregate -c repos.yml
#
# Only the THAIACC_PROFILE=aggregate flow uses this file. The default 20.0
# profile is official-only and does not read it.
#
# 20.0 STATUS (checked 2026-11-06): every OCA repo below now has a 20.0 branch,
# but most modules are not migrated into it yet. Upstream 20.0 currently ships
# date_range (server-ux), partner_title (partner-contact), mis_builder
# (mis-builder), and l10n_th_base_utils + l10n_th_amount_to_text
# (l10n-thailand). It does NOT yet ship base_tier_validation, report_xlsx*,
# partner_firstname or partner_company_type. See MIGRATION-20.0.md §4.
# For the 19.0 feature set, use the 19.0 branch of this repo.

# Needed for date_range (l10n_th_account_tax_report depends on it).
# The tier_validation family moved out of this repo for 19.0 — see ./tier-validation.
./server-ux:
  remotes:
    oca: https://github.com/OCA/server-ux.git
  merges:
    - oca 20.0
  target: oca 20.0

# New repo in 19.0: the whole tier_validation family was split out of server-ux.
# Provides base_tier_validation, base_tier_validation_formula,
# purchase_request_tier_validation.
./tier-validation:
  remotes:
    oca: https://github.com/OCA/tier-validation.git
  merges:
    - oca 20.0
  target: oca 20.0

# No 20.0-mig-* branches exist on the monthop-gmail fork. The six this list
# used to name (account_tax_report, account_wht_cert_form, mis_report, partner,
# tier_department, tier_department_demo) were never created, so the aggregate
# failed on them. Those modules are in the Later bucket (MIGRATION-20.0.md §6).
# Add a `monthop` remote and a `monthop 20.0-mig-<module>` merge line here once
# such a branch actually exists.
./l10n-thailand:
  remotes:
    oca: https://github.com/OCA/l10n-thailand.git
  merges:
    - oca 20.0
  target: oca 20.0

# OCA/partner-contact#2161 merged partner_company_type into 19.0, not 20.0.
# The 20.0 branch does not have it yet (only partner_title, of the trio).
./partner-contact:
  remotes:
    oca: https://github.com/OCA/partner-contact.git
  merges:
    - oca 20.0
  target: oca 20.0

# mis_builder is on OCA/mis-builder 20.0, so no migration branch is needed.
./mis-builder:
  remotes:
    oca: https://github.com/OCA/mis-builder.git
  merges:
    - oca 20.0
  target: oca 20.0

./reporting-engine:
  remotes:
    oca: https://github.com/OCA/reporting-engine.git
  merges:
    - oca 20.0
  target: oca 20.0
