services:
  odoo:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    entrypoint: ["/bin/bash", "/workspace/.devcontainer/entrypoint.sh"]
    volumes:
      - .:/workspace:cached
      - odoo-data:/var/lib/odoo
    ports:
      - "8069:8069"
      - "8072:8072"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      # official = Odoo 20 official-only baseline (no OCA aggregation,
      # installs the core l10n_th chart); aggregate = full gitaggregate
      # flow + thaiacc meta-package
      - THAIACC_PROFILE=official
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  odoo-data:
  pgdata:
